name: Temporary EpicRelease Rentry page
on:
  push:
    branches:
      - tmp-epicrelease-carousel-link-20260921
    paths:
      - .github/workflows/tmp-publish-rentry.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create temporary Rentry page
        run: |
          slug="epicrelease-carousel-$(date +%s)-$RANDOM"
          edit_code=$(openssl rand -hex 12)
          response=$(curl --fail --silent --show-error --retry 3 \
            -A 'EpicRelease-carousel-transfer/1.0' \
            --data-urlencode "url=$slug" \
            --data-urlencode "edit_code=$edit_code" \
            --data-urlencode 'text=# EpicRelease — Carrusel mobile

[Descargar las 8 láminas](https://paste.c-net.org/SummaryBenny)' \
            https://rentry.co/api/new)
          printf '%s\n' "$response" > rentry-response.json
          python - <<'PY'
          import json
          data=json.load(open('rentry-response.json'))
          if data.get('status') not in (200,'200'):
              raise SystemExit(data)
          print(data)
          PY
      - name: Save temporary page response
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rentry-response.json
          git commit -m "Save temporary EpicRelease Rentry page [skip ci]"
          git push
