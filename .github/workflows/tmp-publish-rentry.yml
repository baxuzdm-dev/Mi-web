name: Temporary Rentry publisher
on:
  push:
    branches:
      - tmp-epicrelease-carousel-link-20260921
    paths:
      - .github/workflows/tmp-publish-rentry.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create page
        shell: bash
        run: |
          slug="epicrelease-carousel-$(date +%s)-$RANDOM"
          code="$(openssl rand -hex 12)"
          text=$'# EpicRelease - Carrusel mobile\n\n[Descargar las 8 laminas](https://paste.c-net.org/SummaryBenny)'
          curl --fail --silent --show-error --retry 3 \
            -A 'EpicRelease-carousel-transfer/1.0' \
            --data-urlencode "url=$slug" \
            --data-urlencode "edit_code=$code" \
            --data-urlencode "text=$text" \
            https://rentry.co/api/new > rentry-response.json
          cat rentry-response.json
      - name: Save response
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rentry-response.json
          git commit -m "Save temporary Rentry response [skip ci]"
          git push
